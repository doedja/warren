[workspace]
resolver = "2"
members = ["crates/warren-proto", "crates/warren"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/doedja/warren"
rust-version = "1.74"

[workspace.dependencies]
# shared across crates; pinned loosely, real versions resolved by Cargo.lock
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
