[package]
name = "warren"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Residential proxy pool from your own devices. Single binary: hub + node modes."

[[bin]]
name = "warren"
path = "src/main.rs"

[dependencies]
warren-proto = { path = "../warren-proto" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
base64 = "0.22"
rand = "0.8"
# TLS on the node-hub link (opt-in via --tls). Pinned to the `ring` crypto
# provider so the Docker build needs no cmake (aws-lc-rs would).
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "ring"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
# Node identity: ed25519 keypair, signed enrollment.
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Persistence + admin surface.
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.7"
