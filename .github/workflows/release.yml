name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    # Third-party actions are pinned to commit SHAs: this job's token has
    # contents:write, so a hijacked mutable tag could publish attacker binaries
    # WITH matching .sha256 files that install.sh (and auto-updating fleets)
    # would happily verify and run.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the matching version's section from CHANGELOG.md as the release
          # notes. allow-missing keeps the release from failing if a tag has no entry.
          changelog: CHANGELOG.md
          allow-missing-changelog: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` is the friendly asset label; `target` is the Rust triple.
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            name: macos-x86_64
            os: macos-latest
          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # ring needs nasm to assemble on windows-msvc.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1
        with:
          bin: warren
          target: ${{ matrix.target }}
          # $tag is the release tag (e.g. v0.1.9): warren-v0.1.9-linux-x86_64.tar.gz
          archive: warren-$tag-${{ matrix.name }}
          # Publish a sha256 next to each archive so install.sh can verify the
          # download before extracting/running it (uploads warren-$tag-NAME.sha256,
          # the archive name without its extension).
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
