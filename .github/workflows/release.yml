name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Publish the matching version's section from CHANGELOG.md as the release
          # notes. allow-missing keeps the release from failing if a tag has no entry.
          changelog: CHANGELOG.md
          allow-missing-changelog: true

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `name` is the friendly asset label; `target` is the Rust triple.
          - target: x86_64-unknown-linux-musl
            name: linux-x86_64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            name: linux-arm64
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            name: macos-x86_64
            os: macos-latest
          - target: aarch64-apple-darwin
            name: macos-arm64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # ring needs nasm to assemble on windows-msvc.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: warren
          target: ${{ matrix.target }}
          # $tag is the release tag (e.g. v0.1.9): warren-v0.1.9-linux-x86_64.tar.gz
          archive: warren-$tag-${{ matrix.name }}
          token: ${{ secrets.GITHUB_TOKEN }}
