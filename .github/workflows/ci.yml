name: CI

on:
  push:
  pull_request:

# Nothing in CI writes to the repo; don't hand the jobs a write-capable token.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose

  # Compile (build + clippy) on macOS and Windows so the platform-specific
  # service-install paths (launchd, schtasks) are actually checked on their real
  # targets. The ubuntu job above owns fmt + tests.
  cross-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --verbose

  # Enforce the declared MSRV (rust-version in Cargo.toml). A build with the
  # exact pinned toolchain fails the job if a dependency or new syntax pushes the
  # real minimum above 1.88, so the claim cannot silently rot. (The floor is set
  # by the `time` crate, which requires 1.88; keep this in sync with Cargo.toml.)
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust 1.88
        uses: dtolnay/rust-toolchain@1.88
      - name: Cache
        uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build --verbose

  # Fail on dependencies with a known RUSTSEC advisory.
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit
        run: cargo audit
